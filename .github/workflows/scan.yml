name: Scan for arbs
on:
  schedule:
    - cron: "0 13-23/2 * * *"   # every 2 hrs, 9am–7pm ET (fits the free 500/mo key)
  workflow_dispatch:            # "Run workflow" button = scan now
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python arb.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}
          BANKROLL:     ${{ vars.BANKROLL || '100' }}
          MIN_PROFIT:   ${{ vars.MIN_PROFIT || '0.5' }}
