name: Scan for arbs
on:
  schedule:
    - cron: "30 16,19,22 * * *"   # 11:30am, 2:30pm, 5:30pm ET
    - cron: "30 1 * * *"          # 8:30pm ET (budget is paced to last the month)
  workflow_dispatch:            # "Run workflow" button = scan now
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python arb.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || '9e666e4d02c6e06932cfbf6c98cb7129' }}
          NTFY_TOPIC:   arb-shlomo-903401ee
          BANKROLL:     ${{ vars.BANKROLL || '100' }}
          MIN_PROFIT:   ${{ vars.MIN_PROFIT || '1.0' }}
